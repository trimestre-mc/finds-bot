name = "finds-bot"
main = "src/index.js"
compatibility_date = "2026-09-01"

[triggers]
# Workers gratuit : 5 crons pour tout le compte. Chaque cron est une exécution séparée, avec ses 50 requêtes externes.
crons = ["* * * * *", "*/2 * * * *", "1-59/2 * * * *", "*/3 * * * *", "*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "finds-bot"
database_id = "491d8592-7575-4b7e-8858-ccba2b5a3e7b"

[ai]
binding = "AI"

[vars]
DISCORD_APP_ID = "1564065839194448043"
DISCORD_PUBLIC_KEY = "d10bd37d232a95ebe948df712c3f68b7eeb8d5e70af9986852beb1112e89f871"
# Seul ce compte Discord peut modifier les liens d'affiliation (agents)
AGENTS_OWNER_ID = "944704520326348830"
PUBLIC_URL = "https://finds-bot.wheatenmoon5861.workers.dev"  # boutons suivis (/go)
GITHUB_REPO = "trimestre-mc/finds-bot"  # avec le secret GITHUB_TOKEN : indexation immédiate à l'ajout d'un catalogue
# Base Turso (secrets TURSO_URL, TURSO_TOKEN) : budgets d'écriture quotidiens adaptés à son quota gratuit
# (10 M lignes écrites / mois ≈ 330 000 / jour). Sans Turso, le bot utilise D1 et ses budgets par défaut.
BUDGET_ITEMS = "200000"
BUDGET_PAGES = "200000"
BUDGET_CATEGORIZE = "200000"
BUDGET_QCSYNC = "200000"
READS_MONTH_CAP = "480000000"  # Turso gratuit : 500 M lignes lues / mois ; au-delà, plus de travail de fond
BUDGET_MONTH_ROWS = "9000000"  # Turso gratuit : 10 M lignes écrites / mois, marge pour posts, clics et traductions

# Secrets (wrangler secret put ...) : DISCORD_BOT_TOKEN, INDEXER_SECRET, GITHUB_TOKEN (optionnel)
