name: indexer

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: indexer
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier s'il y a du travail
        id: jobs
        run: |
          n=$(curl -sf -H "Authorization: Bearer ${{ secrets.INDEXER_SECRET }}" "${{ secrets.WORKER_URL }}/api/indexer/jobs" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d['shops']) + d.get('missingImages', 0) + d.get('linkQueue', 0) + (1 if d.get('jadeship') else 0))")
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "$n catalogue(s) ou photos à traiter"

      - uses: actions/setup-node@v4
        if: steps.jobs.outputs.count != '0'
        with:
          node-version: 22

      - name: Installer Playwright
        if: steps.jobs.outputs.count != '0'
        working-directory: indexer
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Indexer
        if: steps.jobs.outputs.count != '0'
        working-directory: indexer
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          INDEXER_SECRET: ${{ secrets.INDEXER_SECRET }}
        run: node index.mjs
