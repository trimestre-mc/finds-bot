name: indexer

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    # 4 jobs en parallèle, chacun avec sa part des boutiques et des items (et sa propre adresse IP).
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    concurrency:
      group: indexer-${{ matrix.shard }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier s'il y a du travail
        id: jobs
        run: |
          n=$(curl -sf -H "Authorization: Bearer ${{ secrets.INDEXER_SECRET }}" "${{ secrets.WORKER_URL }}/api/indexer/jobs?shard=${{ matrix.shard }}&shards=4" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d['shops']) + d.get('missingImages', 0) + d.get('linkQueue', 0) + d.get('qcNeeded', 0) + (1 if d.get('jadeship') else 0))")
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "$n catalogue(s) ou photos à traiter"

      - uses: actions/setup-node@v4
        if: steps.jobs.outputs.count != '0'
        with:
          node-version: 22

      - name: Installer Playwright
        if: steps.jobs.outputs.count != '0'
        working-directory: indexer
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Indexer
        if: steps.jobs.outputs.count != '0'
        working-directory: indexer
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          INDEXER_SECRET: ${{ secrets.INDEXER_SECRET }}
          SHARD: ${{ matrix.shard }}
          SHARDS: 4
        run: node index.mjs
