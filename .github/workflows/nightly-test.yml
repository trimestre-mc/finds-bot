name: test-nightly

# Chaque nuit (4 h 30 à Paris en hiver) : tests rapides puis contrôle du bot en production (services, index de
# recherche, vraies recherches). En cas d'échec, le bot envoie un MP au propriétaire avec le lien vers le détail.
# (Le test de bout en bout complet se lance en local : sur GitHub, Weidian bloque les adresses des machines.)
on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer
        run: npm ci --no-audit --no-fund

      - name: Tests rapides
        run: npm test

      - name: Contrôle du bot en production
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          INDEXER_SECRET: ${{ secrets.INDEXER_SECRET }}
        run: node test/smoke.mjs

      - name: Prévenir le propriétaire
        if: failure()
        run: |
          curl -s -X POST -H "Authorization: Bearer ${{ secrets.INDEXER_SECRET }}" -H "Content-Type: application/json" \
            -d "{\"title\":\"Le test de nuit a échoué\",\"detail\":\"Quelque chose a cassé dans le bot. Détail : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "${{ secrets.WORKER_URL }}/api/notify-owner"
