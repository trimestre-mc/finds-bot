    </linearGradient>
    <radialGradient id="g1" cx="0.18" cy="0.2" r="0.6"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".55"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
